<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content5="width=device-width, initial-scale=1.0">
    <title>البث المباشر - المنصة الرياضية</title>
    <!-- استدعاء تايليند سي دي إن -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- هيدر صفحة البث -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border border-slate-700/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    الرئيسية
                </a>
                <span class="text-xs text-slate-400 border-r border-slate-800 pr-3 hidden sm:inline">غرفة البث المباشر</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
                <span class="text-xs font-bold text-red-400 uppercase tracking-wider">بث مباشر آمن وخالٍ من الإعلانات</span>
            </div>
        </div>
    </header>

    <!-- محتوى البث الأساسي -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">
        
        <!-- معلومات المباراة الحالية -->
        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl p-4 sm:p-6 shadow-xl">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-right">
                <div>
                    <span class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-full font-medium">دوري أبطال أوروبا</span>
                    <h1 class="text-xl sm:text-2xl font-black text-white mt-2">ريال مدريد ضد برشلونة</h1>
                </div>
                <div class="flex items-center gap-3 bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                    <span class="text-emerald-400 font-bold text-sm">الشوط الثاني</span>
                    <span class="text-slate-500">|</span>
                    <span class="text-red-400 font-bold text-sm animate-pulse">الدقيقة 78'</span>
                </div>
            </div>
        </div>

        <!-- مشغل الفيديو (Video Player Container) -->
        <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center">
            <!-- مكان عرض البث أو الـ Iframe الخاص بالسيرفر -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-slate-950">
                <div class="w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mb-4 shadow-lg">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h3 class="text-base font-bold text-white mb-1">مشغل البث النظيف جاهز</h3>
                <p class="text-xs text-slate-400 max-w-md">هنا سيتم إدراج رابط السيرفر أو مشغل الفيديو الخاص بك (iframe) ليعمل بكفاءة عالية وبدون إعلانات منبثقة مزعجة.</p>
            </div>
        </div>

        <!-- جودة السيرفرات (لتبديل السيرفرات لو توفرت) -->
        <div class="flex items-center justify-between bg-slate-900/40 border border-slate-800/80 rounded-xl p-3">
            <span class="text-xs text-slate-400 font-medium">اختر سيرفر البث:</span>
            <div class="flex gap-2">
                <button class="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold shadow">سيرفر رئيسي (FHD)</button>
                <button class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition-all">سيرفر احتياطي</button>
            </div>
        </div>

    </main>

</body>
              </html>
