<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل البث والأهداف - موسم 2026/2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

<div>
    <!-- الهيدر -->
    <header class="bg-slate-900/85 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border border-slate-700/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    الرئيسية
                </a>
                <span class="text-xs text-slate-400 border-r border-slate-800 pr-3 hidden sm:inline">غرفة البث والأرشيف</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">منصة آمنة بدون إعلانات</span>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">
        
        <!-- بطاقة تفاصيل المباراة -->
        <div class="bg-gradient-to-b from-slate-900 to-slate-950 backdrop-blur-md border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col gap-6">
            
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    <span id="match-league" class="text-xs font-bold text-blue-400">الدوري</span>
                </div>
                <span id="match-channel" class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full font-medium border border-slate-700">قناة: beIN Sports</span>
            </div>

            <!-- أسماء الفرق والنتيجة -->
            <div class="grid grid-cols-3 items-center text-center gap-2">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-slate-800/50 rounded-2xl border border-slate-700/60 flex items-center justify-center shadow-lg p-2">
                        <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <span id="team-1-name" class="text-sm sm:text-base font-bold text-white leading-tight">الفريق الأول</span>
                </div>

                <div class="flex flex-col items-center justify-center">
                    <span id="match-status" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1 rounded-full font-bold mb-1.5">الحالة</span>
                    <span id="match-score" class="text-xl sm:text-2xl font-black text-emerald-400 tracking-wider">VS</span>
                    <span id="match-date" class="text-[11px] text-slate-500 mt-1">2026</span>
                </div>

                <div class="flex flex-col items-center gap-2">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-slate-800/50 rounded-2xl border border-slate-700/60 flex items-center justify-center shadow-lg p-2">
                        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <span id="team-2-name" class="text-sm sm:text-base font-bold text-white leading-tight">الفريق الثاني</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800/85 text-xs text-slate-400 text-center">
                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                    🏟️ الملعب: <span id="match-stadium" class="text-slate-200 font-medium">-</span>
                </div>
                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                    🎙️ المعلق: <span id="match-commentator" class="text-slate-200 font-medium">-</span>
                </div>
            </div>
        </div>

        <!-- أزرار التبديل للمباريات المنتهية (تظهر فقط إذا كانت المباراة منتهية وتحتوي على أهداف أو إعادة) -->
        <div id="archive-buttons-container" class="hidden grid-cols-2 gap-3">
            <button onclick="switchVideo('highlights')" id="btn-highlights" class="py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2">
                ⚽ ملخص الأهداف
            </button>
            <button onclick="switchVideo('fullmatch')" id="btn-fullmatch" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2 border border-slate-700">
                📺 إعادة مشاهدة المباراة كاملة
            </button>
        </div>

        <!-- المشغل -->
        <div class="relative w-full aspect-video bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl">
            <iframe id="match-iframe" src="" class="w-full h-full border-0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>

    </main>
</div>

    <!-- التذييل -->
    <footer class="bg-slate-900/60 border-t border-slate-800/80 py-6 mt-12 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>© 2026 جميع الحقوق محفوظة - منصة البث الرياضي النظيف</p>
            <div class="flex gap-4 text-slate-400">
                <a href="index.html" class="hover:text-white transition-colors">الرئيسية</a>
            </div>
        </div>
    </footer>

    <!-- سكريبت إدارة الروابط والفيديوهات -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('match') || 'rm-inter';

        // قاعدة البيانات تحتوي على روابط الملخص وإعادة المباراة لكل مباراة منتهية
        const db = {
            'rm-inter': {
                league: 'دوري أبطال أوروبا (مرحلة الدوري)',
                channel: 'beIN Sports HD 1',
                team1: 'ريال مدريد',
                team2: 'إنتر ميلان',
                score: '2 - 1',
                status: 'نتيجة نهائية (FT)',
                date: '16 سبتمبر 2026',
                stadium: 'سانتياغو برنابيو',
                commentator: 'حفيظ دراجي',
                isFinished: true,
                highlightsUrl: 'https://www.youtube.com/embed/jfKfPfyJRdk', // رابط فيديو ملخص أهداف ريال مدريد وإنتر
                fullMatchUrl: 'https://www.youtube.com/embed/5qap5aO4i9A'  // رابط فيديو إعادة المباراة كاملة
            },
            'barca-fey': {
                league: 'دوري أبطال أوروبا (مرحلة الدوري)',
                channel: 'beIN Sports HD 2',
                team1: 'برشلونة',
                team2: 'فاينورد',
                score: '5 - 1',
                status: 'نتيجة نهائية (FT)',
                date: '16 سبتمبر 2026',
                stadium: 'لويس كومبانيس الأولمبي',
                commentator: 'عصام الشوالي',
                isFinished: true,
                highlightsUrl: 'https://www.youtube.com/embed/jfKfPfyJRdk', // رابط ملخص برشلونة وفاينورد
                fullMatchUrl: 'https://www.youtube.com/embed/5qap5aO4i9A'  // رابط إعادة مباراة برشلونة كاملة
            },
            'mci-sun': {
                league: 'الدوري الإنجليزي الممتاز - الجولة 5',
                channel: 'beIN Sports HD 1',
                team1: 'مانشستر سيتي',
                team2: 'سندرلاند',
                score: 'VS',
                status: 'قريباً - يبدأ الليلة',
                date: '20 سبتمبر 2026',
                stadium: 'الاتحاد',
                commentator: 'خليل البلوشي',
                isFinished: false,
                highlightsUrl: '',
                fullMatchUrl: 'https://www.youtube.com/embed/jfKfPfyJRdk' // بث مباشر للمباراة
            },
            'ful-mun': {
                league: 'الدوري الإنجليزي الممتاز - الجولة 5',
                channel: 'beIN Sports HD 2',
                team1: 'فولهام',
                team2: 'مانشستر يونايتد',
                score: 'VS',
                status: 'قريباً - يبدأ الليلة',
                date: '20 سبتمبر 2026',
                stadium: 'كرافن كوتيج',
                commentator: 'علي محمد علي',
                isFinished: false,
                highlightsUrl: '',
                fullMatchUrl: 'https://www.youtube.com/embed/jfKfPfyJRdk' // بث مباشر للمباراة
            }
        };

        let currentMatch = db[matchId] || db['rm-inter'];

        // تعبئة البيانات في الصفحة
        document.getElementById('match-league').textContent = currentMatch.league;
        document.getElementById('match-channel').textContent = 'قناة: ' + currentMatch.channel;
        document.getElementById('team-1-name').textContent = currentMatch.team1;
        document.getElementById('team-2-name').textContent = currentMatch.team2;
        document.getElementById('match-score').textContent = currentMatch.score;
        document.getElementById('match-status').textContent = currentMatch.status;
        document.getElementById('match-date').textContent = currentMatch.date;
        document.getElementById('match-stadium').textContent = currentMatch.stadium;
        document.getElementById('match-commentator').textContent = currentMatch.commentator;

        // التحقق إذا كانت المباراة منتهية لإظهار أزرار الأرشيف والملخصات
        if (currentMatch.isFinished) {
            document.getElementById('archive-buttons-container').classList.remove('hidden');
            document.getElementById('archive-buttons-container').classList.add('grid');
            // تشغيل ملخص الأهداف افتراضياً عند فتح مباراة منتهية
            document.getElementById('match-iframe').src = currentMatch.highlightsUrl;
        } else {
            // إذا كانت المباراة قادمة، نشغل رابط البث المباشر مباشرة
            document.getElementById('match-iframe').src = currentMatch.fullMatchUrl;
        }

        // دالة التبديل بين ملخص الأهداف وإعادة المباراة كاملة
        function switchVideo(type) {
            const iframe = document.getElementById('match-iframe');
            const btnHighlights = document.getElementById('btn-highlights');
            const btnFullMatch = document.getElementById('btn-fullmatch');

            if (type === 'highlights') {
                iframe.src = currentMatch.highlightsUrl;
                btnHighlights.className = "py-3 bg-emerald-600 text-white rounded-2xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2";
                btnFullMatch.className = "py-3 bg-slate-800 text-slate-300 rounded-2xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2 border border-slate-700";
            } else if (type === 'fullmatch') {
                iframe.src = currentMatch.fullMatchUrl;
                btnFullMatch.className = "py-3 bg-emerald-600 text-white rounded-2xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2";
                btnHighlights.className = "py-3 bg-slate-800 text-slate-300 rounded-2xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2 border border-slate-700";
            }
        }
    </script>

</body>
</html>
