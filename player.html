<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر - المنصة الرياضية</title>
    <!-- استدعاء تايليند سي دي إن -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

<div>
    <!-- هيدر صفحة البث -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border border-slate-700/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    الرئيسية
                </a>
                <span class="text-xs text-slate-400 border-r border-slate-800 pr-3 hidden sm:inline">غرفة البث المباشر</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
                <span class="text-xs font-bold text-red-400 uppercase tracking-wider">بث مباشر آمن وخالٍ من الإعلانات</span>
            </div>
        </div>
    </header>

    <!-- محتوى البث الأساسي -->
    <main class="max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">
        
        <!-- معلومات المباراة الحالية مع زر المشاركة -->
        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-right">
            <div>
                <span class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-full font-medium">دوري أبطال أوروبا</span>
                <h1 class="text-xl sm:text-2xl font-black text-white mt-2">ريال مدريد ضد برشلونة</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-3 bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                    <span class="text-emerald-400 font-bold text-sm">الشوط الثاني</span>
                    <span class="text-slate-500">|</span>
                    <span class="text-red-400 font-bold text-sm animate-pulse">الدقيقة 78'</span>
                </div>

                <!-- زر مشاركة المباراة التفاعلي -->
                <button onclick="shareMatch()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2.5 rounded-xl border border-slate-700/60 transition-all flex items-center justify-center shadow-lg group" title="مشاركة المباراة">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- مشغل الفيديو (Video Player Container) -->
        <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
            <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk" class="w-full h-full border-0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>
        
        <!-- جودة السيرفرات -->
        <div class="flex items-center justify-between bg-slate-900/40 border border-slate-800/80 rounded-xl p-3">
            <span class="text-xs text-slate-400 font-medium">اختر سيرفر البث:</span>
            <div class="flex gap-2">
                <button class="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold shadow">سيرفر رئيسي (FHD)</button>
                <button class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition-all">سيرفر احتياطي</button>
            </div>
        </div>

    </main>
</div>

    <!-- تذييل الموقع (Footer) -->
    <footer class="bg-slate-900/60 border-t border-slate-800/80 py-6 mt-12 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>© 2026 جميع الحقوق محفوظة - منصة البث الرياضي النظيف</p>
            <div class="flex gap-4 text-slate-400">
                <a href="index.html" class="hover:text-white transition-colors">الرئيسية</a>
                <a href="#" class="hover:text-white transition-colors">سياسة الخصوصية</a>
                <a href="#" class="hover:text-white transition-colors">اتصل بنا</a>
            </div>
        </div>
    </footer>

    <!-- سكريبت نسخ الرابط للمشاركة -->
    <script>
        function shareMatch() {
            if (navigator.share) {
                navigator.share({
                    title: 'مشاهدة مباراة ريال مدريد وبرشلونة',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط البث بنجاح!');
            }
        }
    </script>

</body>
</html>
