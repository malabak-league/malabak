<!-- الهيدر الاحترافي -->
<header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        
        <!-- الشعار واسم المنصة -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <span class="text-lg font-black tracking-wider text-white">MALABAK</span>
                <span class="text-xs block text-emerald-400 font-medium">بث مباشر بدون إعلانات</span>
            </div>
        </div>

        <!-- روابط التنقل (تظهر على الشاشات الكبيرة) -->
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
            <a href="#" class="text-white hover:text-emerald-400 transition-colors">الرئيسية</a>
            <a href="#" class="hover:text-emerald-400 transition-colors">المباريات</a>
            <a href="#" class="hover:text-emerald-400 transition-colors">المفضلة</a>
        </nav>

        <!-- مؤشر الحالة / زر سريعة -->
        <div class="flex items-center gap-3">
            <div class="hidden sm:flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs text-slate-300 font-medium">السيرفرات تعمل</span>
            </div>
        </div>

    </div>
</header>
<!-- شريط المباريات الحية (Live Ticker) -->
<div class="bg-slate-900 border-b border-slate-800 py-2.5 overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
        
        <!-- عنوان الشريط -->
        <div class="flex items-center gap-2 shrink-0 pl-4 border-l border-slate-800">
            <span class="flex h-3 w-3 relative">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
            <span class="text-xs font-bold tracking-wider text-white uppercase">مباريات مباشرة</span>
        </div>

        <!-- محتوى الشريط المتحرك (أو المباريات الحالية) -->
        <div class="flex items-center gap-8 overflow-x-auto scrollbar-none pr-4 text-xs font-medium text-slate-300 whitespace-nowrap">
            <div class="flex items-center gap-2 bg-slate-950/60 px-3 py-1.5 rounded-lg border border-slate-800/80">
                <span class="text-emerald-400 font-bold">ريال مدريد</span>
                <span class="text-slate-500">vs</span>
                <span class="text-emerald-400 font-bold">برشلونة</span>
                <span class="bg-red-500/20 text-red-400 px-1.5 py-0.5 rounded text-[10px] font-bold animate-pulse">الشوط الثاني 75'</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-950/60 px-3 py-1.5 rounded-lg border border-slate-800/80">
                <span class="text-emerald-400 font-bold">ليفربول</span>
                <span class="text-slate-500">vs</span>
                <span class="text-emerald-400 font-bold">مانشستر سيتي</span>
                <span class="bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded text-[10px] font-bold">مباشر</span>
            </div>
        </div>

    </div>
</div>
